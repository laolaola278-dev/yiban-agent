<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>广职院职工登录页面</title>
    <!-- 引入 Layui CSS -->
    <!-- <link rel="stylesheet" href="https://www.layuicdn.com/layui-v2.6.8/css/layui.css"> -->
    <link rel="stylesheet" href="/public/assets/extend/alayui/css/layui.css">
    <style>
        body {
            background: #f2f2f2 url("/public/main/image/login_bg.jpg") no-repeat left top;background-size:100% 100%;height: 100%;
            filter:progid:DXImageTransform.Microsoft.AlphaImageLoader(src='../../../../public/main/image/login_bg.jpg',sizingMethod='scale');
        }
        .h-header{height: 130px;background: url("/public/main/image/login_top_bg.png") repeat-x left top;position: fixed;left: 0;top: 0;right: 0;}
        .h-wmo1200 {width: 1200px;margin: 0 auto;overflow: hidden;}
        .h-wmo1200 .am-right{float: right;}
        .cx_bodylay{display: flex;justify-content: center;align-items: center;min-height: 100vh;margin: 0;}
        .login-container {width: 90%;max-width: 400px;background: #fff;border-radius: 5px;box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);padding: 25px;box-sizing: border-box;}
        .login-title {text-align: center;margin-bottom: 20px;font-size: 22px;color: #333;}
        .captcha-row {display: flex;margin-bottom: 15px;}
        .captcha-row .layui-input {flex: 1;margin-right: 10px;}
        .captcha-img {height: 38px;cursor: pointer;border-radius: 2px;}
        .submit-btn {width: 100%;}
        @media (max-width: 480px) {  .login-container {width: 95%;padding: 20px 15px;}  }
    </style>
</head>
<body>
<div class="h-header">
    <div class="h-wmo1200">
        <img class="am-left" src="/public/main/image/logo.png" />
        <img class="am-right" src="/public/main/image/logo_font.png" />
    </div>
</div>
<div class="cx_bodylay">
    <div class="login-container">
        <h2 class="login-title">教&nbsp;职&nbsp;工&nbsp;登&nbsp;录</h2>
        <form class="layui-form" lay-filter="loginForm">
            <!-- 账户 -->
            <div class="layui-form-item">
                <label class="layui-form-label layui-font-16">账&nbsp;&nbsp;&nbsp;&nbsp;户</label>
                <div class="layui-input-block">
                    <input type="text" name="account" required lay-verify="required" placeholder="请输入账&nbsp;户" autocomplete="off" class="layui-input">
                </div>
            </div>
            <!-- 密码 -->
            <div class="layui-form-item">
                <label class="layui-form-label layui-font-16">密&nbsp;&nbsp;&nbsp;&nbsp;码</label>
                <div class="layui-input-block">
                    <input type="password" name="pwd" required lay-verify="required" placeholder="请输入密码" autocomplete="off" class="layui-input">
                </div>
            </div>
            <!-- 验证码 -->
            <div class="layui-form-item">
                <label class="layui-form-label layui-font-16">验证码</label>
                <div class="layui-input-block captcha-row">
                    <input type="text" name="captcha" required lay-verify="required" placeholder="请输入验证码" autocomplete="off" class="layui-input">
                    <img id="captchaImg" class="captcha-img" src="/main/index/teacherverify.html" alt="验证码" title="点击刷新验证码" onclick="this.src='/main/index/teacherverify.html?a='+Math.random()">
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-input-block captcha-row">
                    <input type="checkbox" name="remember" title="记住我,7天内自动登录" value="1">
                </div>
            </div>

            <!-- 登录按钮 -->
            <div class="layui-form-item">
                <button class="layui-btn layui-btn-normal submit-btn" lay-submit lay-filter="loginBtn">登&nbsp;&nbsp;&nbsp;&nbsp;录</button>
            </div>
        </form>
    </div>
</div>


<!-- 引入 Layui JS -->
<!-- <script src="https://www.layuicdn.com/layui-v2.6.8/layui.js"></script> -->
<script src="/public/assets/extend/alayui/layui.js"></script>
<script>
    layui.use(['form', 'jquery', 'layer'], function () {
        const form = layui.form;
        const $ = layui.jquery;
        const layer = layui.layer;


        // 监听登录提交
        form.on('submit(loginBtn)', function (data) {
           // console.log(data.field);
            var loadWid = layer.load();
            $.ajax({ //请求登录处理页z
                url: '/main/index/teacher', //登录处理页
                type:"POST",
                dataType: "json",
                data: data.field,
                success: function (resource) { //登录成功后返回的数据
                    layer.close(loadWid);
                    if(resource.status == 1){
                        //登录成功
                        layer.msg('登录成功,正在跳转...', {icon: 1,},
                            function(){
                                                                    window.location.href = '/a_27/1294';
                                                             });
                    } else {
                        layer.msg(resource.msg, function(){});
                    }
                },
                error:function(resource){
                    layer.close(loadWid);
                }
            });
            // 阻止表单跳转
            return false;
        });
    });
</script>
</body>
</html>
