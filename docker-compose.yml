# 易班百事通 Docker 部署：后端(自研RAG) + 前端(kotaemon)
# 用法：1) 配好 .env  2) docker compose up -d  3) 打开 http://localhost:7860
services:
  backend:
    build: .
    container_name: yiban-backend
    ports:
      - "8010:8010"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  kotaemon:
    image: ghcr.io/cinnamon/kotaemon:main-lite
    container_name: yiban-kotaemon
    ports:
      - "7860:7860"
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - OPENAI_API_KEY=sk-local
      - OPENAI_API_BASE=http://backend:8010/v1
    volumes:
      - ./ktem_app_data:/app/ktem_app_data
      - ./data/raw:/app/corpus_raw
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped